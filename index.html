<!DOCTYPE html>
<!-- Baris di atas kasih tau browser: "ini dokumen HTML modern" -->
<html lang="id">
<head>
  <!-- Bagian <head> = info "belakang layar", nggak tampil di halaman -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- baris viewport di atas: bikin halaman rapi di HP, bukan cuma di laptop -->
  <title>Maunhasan — Portfolio</title>
  <!-- teks di tab browser -->
</head>
<body>
  <!-- Bagian <body> = ISI halaman yang beneran keliatan -->

  <h1>Halo, saya Maunhasan</h1>
  <p>Sedang belajar web development dari nol.</p>

</body>
</html>
